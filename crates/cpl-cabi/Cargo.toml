[package]
name = "cpl-cabi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The toolchain's side of the CPL C boundary: the native engine, fault reconstruction, CAdapter, outcome comparison (spec/toolchain.md 1.14)"

[lints]
workspace = true

# spec/toolchain.md 1.2-1.3 (T69, T71): cpl-sema, cpl-syntax, and cpl-rt only as dev-dependencies (its tests check
# the programs they compare, name the coverage gate's operators, and find the C compiler through cpl_rt::testing);
# the interop plan's types reach this crate through cpl-emit-c's re-export. serde_json's
# `unbounded_depth` (a workspace feature) is used by this crate's protocol reader alone.
[dependencies]
cpl-emit-c.workspace = true
cpl-eval.workspace = true
cpl-hir.workspace = true
cpl-project.workspace = true
cpl-rtspec.workspace = true
cpl-diag.workspace = true
num-bigint.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
cpl-sema.workspace = true
cpl-syntax.workspace = true
blake3.workspace = true
cpl-rt.workspace = true
# The input sweeps D5 and the runtime fuzzing D7 of the differential suites (spec/toolchain.md 12.6).
rand.workspace = true
rand_chacha.workspace = true
