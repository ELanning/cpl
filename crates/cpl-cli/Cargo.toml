[package]
name = "cpl-cli"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# Every internal crate (spec/toolchain.md 1.2: cpl-cli depends on all eight).
# `rand` is the OS randomness of `cpl id assign` and of an unseeded `cpl
# test` run (Section 1.3).
[dependencies]
cpl-diag.workspace = true
cpl-syntax.workspace = true
cpl-hir.workspace = true
cpl-project.workspace = true
cpl-sema.workspace = true
cpl-eval.workspace = true
cpl-index.workspace = true
cpl-work.workspace = true
cpl-evolve.workspace = true
cpl-prove.workspace = true
cpl-cabi.workspace = true
cpl-emit-c.workspace = true
cpl-rt.workspace = true
cpl-rtspec.workspace = true
blake3.workspace = true
clap.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "cpl"
path = "src/main.rs"

[dev-dependencies]
# the DAG test of spec/toolchain.md 1.2 (tests/workspace_dag.rs) reads every crate manifest
toml.workspace = true
