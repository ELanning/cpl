[package]
name = "cpl-prove"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# The automatic verifier (spec/verification.md): symbolic execution of the typed HIR and a
# decision procedure for quantifier-free linear integer arithmetic. It depends on the HIR alone,
# so cpl-index can report proof statuses without the evaluator.
[dependencies]
cpl-diag.workspace = true
cpl-hir.workspace = true
cpl-syntax.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
serde_json.workspace = true

[dev-dependencies]
cpl-eval.workspace = true
cpl-project.workspace = true
cpl-sema.workspace = true
